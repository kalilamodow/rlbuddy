[package]
name = "rlbuddy"
version = "1.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
discord-rich-presence = "1.1.0"
egui_plot = "0.35.0"
egui-system-fonts = "0.34.2"
gilrs = "0.11.2"
num_enum = "0.7.6"
rand = "0.10.2"
rdev = "0.5.3"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
ureq = { version = "3.3.0", features = ["json"] }
urlencoding = "2.1.3"
webbrowser = "1.2.1"
windows-future = "0.3.2"

[dependencies.eframe]
version = "0.34.3"
default-features = false
features = ["glow"]

[dependencies.egui_extras]
version = "0.34.3"
default-features = false
features = ["http", "image"]

[dependencies.emath]
version = "0.34.3"
features = ["serde"]

[dependencies.image]
version = "0.25.10"
default-features = false
features = ["jpeg", "png", "webp"]

[dependencies.windows]
version = "0.62.2"
features = ["Media_Control", "Storage_Streams"]

[build-dependencies]
ureq = "3.3.0"

[profile.release]
opt-level = "s"
strip = "symbols"
lto = "thin"
panic = "abort"
