[package]
name = "rlbuddy"
version = "1.2.0"
edition = "2024"

[dependencies]
discord-rich-presence = "1.1.0"
egui_plot = "0.35.0"
gilrs = { version = "0.11.2", features = ["serde-serialize"] }
num_enum = "0.7.6"
rdev = "0.5.3"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.39.6"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
ureq = { version = "3.3.0", features = ["json"] }
urlencoding = "2.1.3"
webbrowser = "1.2.1"
zip = "8.6.0"
# [target.'cfg(linux)'.dependencies]
fontdb = "0.24.0"

[dependencies.eframe]
version = "0.34.3"
default-features = false
features = ["glow", "wayland"]

[dependencies.egui_extras]
version = "0.34.3"
default-features = false
features = ["file", "http", "image"]

[dependencies.emath]
version = "0.34.3"
features = ["serde"]

[dependencies.image]
version = "0.25.10"
default-features = false
features = ["jpeg", "png", "webp"]

[build-dependencies]
ureq = "3.3.0"

[target.'cfg(windows)'.dependencies]
windows-future = "0.3.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = ["Media_Control", "Storage_Streams"]


[profile.release]
opt-level = "s"
strip = "symbols"
lto = "thin"
panic = "abort"
